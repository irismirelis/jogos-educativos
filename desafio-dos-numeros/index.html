<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio dos Números</title>
  <!-- aparece quando o link é compartilhado (LinkedIn, WhatsApp...) -->
  <meta name="description" content="Contas com datas da História e com medidas da Informática (bits, bytes, MB e GB).">
  <meta property="og:title" content="Desafio dos Números">
  <meta property="og:description" content="Contas com datas da História e com medidas da Informática (bits, bytes, MB e GB).">
  <meta property="og:image" content="https://irismirelis.github.io/jogos-educativos/desafio-dos-numeros/capa.png">
  <meta property="og:url" content="https://irismirelis.github.io/jogos-educativos/desafio-dos-numeros/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cartao">
    <a class="voltar" href="../index.html">← Voltar ao menu</a>
    <h1>🔢 Desafio dos Números</h1>

    <!-- TELA 1: escolher o que aprender -->
    <section id="tela-tema">
      <p class="instrucao">Responda 10 perguntas em que a resposta é um número: contas com datas da História ou com medidas da Informática.</p>
      <p class="pergunta-tema">O que você quer aprender?</p>
      <div class="opcoes-tema">
        <button class="opcao-tema" data-tema="historia"><span class="opcao-icone">📜</span>História</button>
        <button class="opcao-tema" data-tema="informatica"><span class="opcao-icone">💻</span>Informática</button>
      </div>
    </section>

    <!-- TELA 2: as perguntas -->
    <section id="tela-jogo" class="escondido">
      <div class="barra-tema">
        <span id="tema-atual" class="tema-atual"></span>
        <button id="trocar-tema" class="trocar-tema">Trocar tema</button>
      </div>
      <p id="progresso" class="progresso"></p>
      <p id="pergunta" class="pergunta"></p>
      <form id="formulario" class="formulario">
        <input id="resposta" type="number" placeholder="Resposta" required>
        <button class="botao" type="submit">Responder</button>
      </form>
      <p id="mensagem" class="mensagem"></p>
    </section>

    <!-- TELA 3: resultado -->
    <section id="tela-fim" class="escondido">
      <p id="resultado" class="resultado"></p>
      <div id="bloco-revisar">
        <h2>Para revisar</h2>
        <ul id="lista-revisar" class="revisar"></ul>
      </div>
      <button id="jogar-de-novo" class="botao">Jogar de novo</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
